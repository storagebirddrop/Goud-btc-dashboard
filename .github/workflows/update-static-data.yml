name: Update static CBS dashboard data
on:
  push:
    branches: [main]
    paths:
      - 'etl/static_export.py'
      - 'etl/data_quality.py'
      - 'etl/sources/cbs.py'
      - 'etl/cbs_historical_update.py'
      - 'data/fixtures/cbs-1995-1999-i1.json'
      - 'data/fixtures/cbs-1995-1999-i1.provenance.json'
      - '.github/workflows/update-static-data.yml'
  schedule:
    - cron: '20 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-cbs-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download live CBS into isolated input
        run: |
          mkdir -p "${RUNNER_TEMP}/cbs-source"
          python -m etl.sources.cbs --output "${RUNNER_TEMP}/cbs-source/live.csv"
      - name: Build fail-closed candidate, without modifying public files
        run: |
          python -m etl.cbs_historical_update --live-csv "${RUNNER_TEMP}/cbs-source/live.csv" --output-dir "${RUNNER_TEMP}/cbs-review"
      - name: Upload blocked revision report for governance review
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cbs-revision-blocked-review-only
          path: ${{ runner.temp }}/cbs-review-revision-review/revision-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify candidate data quality
        run: |
          python -m etl.data_quality --input "${RUNNER_TEMP}/cbs-review/candidate.csv" --output "${RUNNER_TEMP}/cbs-review/candidate.json"
          python -m pytest -q tests/test_cbs_safe_update.py
      - name: Assert no public file changes
        run: |
          git diff --exit-code -- data/cbs-housing.csv frontend/public/data/monthly.json
      - name: Upload review-only candidate and provenance manifest
        uses: actions/upload-artifact@v4
        with:
          name: cbs-validated-review-only
          path: ${{ runner.temp }}/cbs-review/
          if-no-files-found: error
          retention-days: 14
      - name: Confirm manual approval gate
        run: |
          echo "::notice::REVIEW ONLY. No commit, deploy, publication, or CBS revision acceptance."
