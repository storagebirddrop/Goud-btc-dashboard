name: Update static CBS dashboard data
on:
  push:
    branches: [main]
    paths:
      - 'etl/static_export.py'
      - 'etl/data_quality.py'
      - 'etl/sources/cbs.py'
      - 'etl/asset_quality.py'
      - '.github/workflows/update-static-data.yml'
  schedule:
    - cron: '20 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-cbs-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download CBS OData v4
        run: python -m etl.sources.cbs --output data/cbs-housing.csv
      - name: Validate and generate public JSON
        run: python -m etl.static_export --input data/cbs-housing.csv --output frontend/public/data/monthly.json
      - name: Validate generated payload
        run: python -m pytest -q tests/test_static_export.py
      - name: Verify generated source and public JSON parity
        run: python -m etl.data_quality
      - name: Inspect generated data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/cbs-housing.csv frontend/public/data/monthly.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CBS data changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/cbs-housing.csv frontend/public/data/monthly.json
          fi
      - name: Upload validated CBS candidate for manual review
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cbs-validated-candidate
          path: |
            data/cbs-housing.csv
            frontend/public/data/monthly.json
          if-no-files-found: error
          retention-days: 14
      - name: Confirm review gate
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "::notice::Candidate uploaded; review and merge via a separate pull request."
          echo "This workflow cannot commit or push to main."
