name: Update static CBS dashboard data
on:
  push:
    branches: [main]
    paths:
      - 'etl/static_export.py'
      - 'etl/data_quality.py'
      - 'etl/sources/cbs.py'
      - '.github/workflows/update-static-data.yml'
  schedule:
    - cron: '20 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: static-cbs-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Download CBS OData v4
        run: python -m etl.sources.cbs --output data/cbs-housing.csv
      - name: Validate and generate public JSON
        run: python -m etl.static_export --input data/cbs-housing.csv --output frontend/public/data/monthly.json
      - name: Validate generated payload
        run: python -m pytest -q tests/test_static_export.py
      - name: Verify generated source and public JSON parity
        run: python -m etl.data_quality
      - name: Commit only validated data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cbs-housing.csv frontend/public/data/monthly.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh verified CBS monthly history"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
