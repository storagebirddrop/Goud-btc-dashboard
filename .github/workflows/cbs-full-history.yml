name: CBS full history validation
on:
  pull_request:
    paths:
      - 'etl/sources/cbs.py'
      - 'tests/test_cbs_full_history.py'
      - '.github/workflows/cbs-full-history.yml'
  workflow_dispatch:
  schedule:
    - cron: '43 6 * * 1'
permissions:
  contents: read
jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate all historical CBS months
        run: python -m pytest -q tests/test_cbs_full_history.py
        env:
          CBS_FULL_HISTORY: '1'
