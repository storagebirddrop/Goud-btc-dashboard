name: HIST-03 World Bank GOLD precision analysis (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hist-03-precision.yml'
      - 'tools/hist_03_precision.py'
      - 'tests/test_hist_03_precision.py'
permissions:
  contents: read
jobs:
  precision:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/hist-03-worldbank-gold-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_03_precision.py
      - name: Precision analysis of the real workbook (aggregates/metadata only, raw bytes stay in memory)
        run: python -m tools.hist_03_precision --summary-out "$RUNNER_TEMP/hist-03-precision.json"
      - name: Metadata-only review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-03-precision-review-only
          path: ${{ runner.temp }}/hist-03-precision.json
          if-no-files-found: warn
          retention-days: 14
