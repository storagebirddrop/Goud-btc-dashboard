name: HIST-02 controlled source acquisition (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hist-02-controlled-acquisition.yml'
      - 'tools/hist_02_acquire.py'
      - 'tests/test_hist_02_acquire.py'
permissions:
  contents: read
jobs:
  research-acquisition:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/hist-02-source-pinning-annual-prototype')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline acquisition security tests
        run: python -m pytest -q tests/test_hist_02_acquire.py tests/test_hist_02_annual_research.py
      - name: Controlled original-byte acquisition (no raw upload)
        env:
          HIST02_TMP: ${{ runner.temp }}/hist-02-inputs
        run: |
          umask 077
          trap 'if [ -f "$HIST02_TMP/manifest.json" ]; then cp "$HIST02_TMP/manifest.json" "$RUNNER_TEMP/hist-02-manifest.json"; fi' EXIT
          python -m tools.hist_02_acquire --ephemeral-directory "$HIST02_TMP"
      - name: Metadata-only review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-02-source-metadata-review-only
          path: ${{ runner.temp }}/hist-02-manifest.json
          if-no-files-found: warn
          retention-days: 14
