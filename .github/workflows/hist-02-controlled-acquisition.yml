name: HIST-02 controlled source acquisition (research only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline acquisition security tests
        run: python -m pytest -q tests/test_hist_02_acquire.py tests/test_hist_02_annual_research.py
      - name: Controlled original-byte acquisition (no raw upload)
        env:
          HIST02_TMP: ${{ runner.temp }}/hist-02-inputs
        run: |
          umask 077
          python -m tools.hist_02_acquire --ephemeral-directory "$HIST02_TMP"
          cp "$HIST02_TMP/manifest.json" "$RUNNER_TEMP/hist-02-manifest.json"
      - name: Metadata-only review artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hist-02-source-metadata-review-only
          path: ${{ runner.temp }}/hist-02-manifest.json
          if-no-files-found: error
          retention-days: 14
