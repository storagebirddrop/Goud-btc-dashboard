name: HIST-10 housing in grams of gold (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hist-10-gold-housing.yml'
      - 'tools/hist_10_*.py'
      - 'tests/test_hist_10_*.py'
      - 'data/fixtures/hist10/**'
      - 'etl/hist_*.py'
permissions:
  contents: read
jobs:
  hist-10:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_10_gold_housing.py tests/test_hist_09_bundle.py
      - name: Build research bundles (read-only sources; unreachable sources are recorded, never replaced)
        run: >
          python -m tools.hist_10_gold_housing
          --inputs data/fixtures/hist09
          --cbs-csv data/cbs-housing.csv
          --production-json frontend/public/data/monthly.json
          --pins data/fixtures/hist10/source_pins.json
          --summary-out "$RUNNER_TEMP/hist-10/summary.json"
          --csv-out "$RUNNER_TEMP/hist-10/derived_grams_halfyear.csv"
          --bundles-out "$RUNNER_TEMP/hist-10-bundles"
      - name: Derived research artifact (aggregates and derived half-year grams; no raw third-party values; rights UNVERIFIED)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-10-gold-housing-not-approved
          path: ${{ runner.temp }}/hist-10/
          if-no-files-found: warn
          retention-days: 14
      - name: Print summary sections (aggregates only)
        if: always()
        run: >
          python -m tools.hist_10_gold_housing --print-summary "$RUNNER_TEMP/hist-10/summary.json"
          --keys "${HIST10_KEYS:-status,flags,defects,missing_sources,source_hashes,vintage_check,pins_candidate,fx_coverage,manifest.quality_flags,rebuild_identical,tables,bundle_validation,coverage,independent,transition,retro_vs_nlg_exact,monthly_mean_vs_provider,production_comparison,aggregation.all_periods,aggregation.by_era,aggregation.grams_sample,aggregation.M5_transaction_weighted_gold_vs_M1_cbs}"
        env:
          HIST10_KEYS: ''
