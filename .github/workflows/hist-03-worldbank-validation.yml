name: HIST-03 World Bank GOLD validation (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hist-03-worldbank-validation.yml'
      - 'tools/hist_03_worldbank_validate.py'
      - 'tools/hist_03_independent_parse.py'
      - 'tests/test_hist_03_worldbank_validate.py'
      - 'tests/test_hist_03_independent_parse.py'
permissions:
  contents: read
jobs:
  worldbank-validation:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/hist-03-worldbank-gold-validation')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install second parser (CI job only; requirements.txt unchanged)
        run: python -m pip install "openpyxl==3.1.5"
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_03_worldbank_validate.py tests/test_hist_03_independent_parse.py tests/test_hist_02_acquire.py
      - name: Validate World Bank GOLD 1975-1999 with independent openpyxl re-parse (metadata only, raw stays in memory)
        run: python -m tools.hist_03_worldbank_validate --independent-parser openpyxl --summary-out "$RUNNER_TEMP/hist-03-summary.json"
      - name: Metadata-only review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-03-worldbank-gold-summary-review-only
          path: ${{ runner.temp }}/hist-03-summary.json
          if-no-files-found: warn
          retention-days: 14
