name: BTC catalog availability probe (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check Coin Metrics BTC reference-rate catalog
        run: python -m etl.coinmetrics_catalog
      - name: Upload coverage report (no prices)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-catalog-coverage
          path: btc-catalog-report.json
          if-no-files-found: warn
          retention-days: 14
