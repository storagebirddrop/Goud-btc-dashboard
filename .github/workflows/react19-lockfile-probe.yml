name: React 19 lockfile probe
on:
  pull_request:
    paths:
      - 'frontend/package.json'
      - '.github/workflows/react19-lockfile-probe.yml'
permissions:
  contents: write
jobs:
  resolve-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve clean React 19 lockfile (no peer overrides)
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Dependency and peer inspection
        run: npm ls react react-dom @types/react @types/react-dom recharts
      - name: TypeScript and Vite build
        run: npm run build
      - name: Upload resolved lockfile for review (no repository write)
        uses: actions/upload-artifact@v4
        with:
          name: react19-lockfile-candidate
          path: frontend/package-lock.json
          if-no-files-found: error
      - name: Commit validated lockfile to isolated PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already committed'
          else
            git commit -m 'chore(frontend): commit validated React 19 lockfile'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
        working-directory: .
