name: HIST-05 NVM and other house-price sources (research only)
on:
  workflow_dispatch:
  push:
    branches:
      - research/hist-05-nl-housing-prices-pre-2000
    paths:
      - '.github/workflows/hist-05-other-sources.yml'
      - 'tools/hist_05_other_sources.py'
      - 'tests/test_hist_05_other_sources.py'
permissions:
  contents: read
jobs:
  other-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_05_other_sources.py tests/test_hist_02_acquire.py
      - name: Probe sources (unreachable sources exit 0 as PARTIAL; parser/integrity defects exit 1)
        run: python -m tools.hist_05_other_sources --cbs-csv data/cbs-housing.csv --summary-out "$RUNNER_TEMP/hist-05-other-sources.json"
      - name: Print aggregates-only summary (no raw third-party data)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hist-05-other-sources.json" ]; then
            python -m tools.hist_05_other_sources --digest "$RUNNER_TEMP/hist-05-other-sources.json"
          fi
      - name: Metadata-only review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-05-other-sources-summary-review-only
          path: ${{ runner.temp }}/hist-05-other-sources.json
          if-no-files-found: warn
          retention-days: 14
