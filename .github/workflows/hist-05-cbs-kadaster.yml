name: HIST-05 CBS/Kadaster house prices (research only)
on:
  workflow_dispatch:
  push:
    branches:
      - research/hist-05-nl-housing-prices-pre-2000
    paths:
      - '.github/workflows/hist-05-cbs-kadaster.yml'
      - 'tools/hist_05_cbs_kadaster.py'
      - 'tests/test_hist_05_cbs_kadaster.py'
permissions:
  contents: read
jobs:
  cbs-kadaster:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_05_cbs_kadaster.py tests/test_hist_02_acquire.py tests/test_hist_03_quality_contract.py
      - name: Probe CBS/Kadaster candidates (unreachable sources exit 0; parser/integrity defects exit 1)
        run: python -m tools.hist_05_cbs_kadaster --summary-out "$RUNNER_TEMP/hist-05-cbs-kadaster.json"
      - name: Print aggregates-only summary (no raw third-party data)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hist-05-cbs-kadaster.json" ]; then
            python -m tools.hist_05_cbs_kadaster --report "$RUNNER_TEMP/hist-05-cbs-kadaster.json"
          fi
      - name: Metadata-only review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-05-cbs-kadaster-summary-review-only
          path: ${{ runner.temp }}/hist-05-cbs-kadaster.json
          if-no-files-found: warn
          retention-days: 14
