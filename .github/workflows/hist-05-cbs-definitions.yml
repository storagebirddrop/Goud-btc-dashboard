name: HIST-05 CBS definitions and rights (research only)
on:
  workflow_dispatch:
  push:
    branches:
      - research/hist-05-nl-housing-prices-pre-2000
    paths:
      - '.github/workflows/hist-05-cbs-definitions.yml'
      - 'tools/hist_05_cbs_definitions.py'
      - 'tests/test_hist_05_cbs_definitions.py'
permissions:
  contents: read
jobs:
  cbs-definitions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install poppler-utils (pdftotext for the CBS method PDFs; text stays in memory)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_05_cbs_definitions.py tests/test_hist_05_cbs_kadaster.py tests/test_hist_02_acquire.py tests/test_hist_03_quality_contract.py
      - name: Probe CBS definitions and rights texts (unreachable sources exit 0; parser/integrity defects exit 1)
        run: python -m tools.hist_05_cbs_definitions --summary-out "$RUNNER_TEMP/hist-05-cbs-definitions.json"
      - name: Metadata-only review artifact (metadata, short quotes, aggregates, sha256; no raw third-party data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hist-05-cbs-definitions-summary-review-only
          path: ${{ runner.temp }}/hist-05-cbs-definitions.json
          if-no-files-found: warn
          retention-days: 14
