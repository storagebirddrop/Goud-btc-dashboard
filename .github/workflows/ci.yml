name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Compile canonical CBS updater
        run: python -m py_compile etl/cbs_historical_update.py
      - run: python -m pytest -q
      - name: Offline 380-month CBS E2E review-only replay
        run: |
          python -m etl.cbs_historical_update --live-csv data/cbs-housing.csv --output-dir "${RUNNER_TEMP}/cbs-i2b-e2e"
          python -m etl.data_quality --input "${RUNNER_TEMP}/cbs-i2b-e2e/candidate.csv" --output "${RUNNER_TEMP}/cbs-i2b-e2e/candidate.json"
          sha256sum "${RUNNER_TEMP}/cbs-i2b-e2e/"*
          cat "${RUNNER_TEMP}/cbs-i2b-e2e/manifest.json"
          git diff --exit-code -- data/cbs-housing.csv frontend/public/data/monthly.json
      - name: Upload isolated 380-month E2E proof
        uses: actions/upload-artifact@v4
        with:
          name: cbs-i2b-380-month-e2e-review-only
          path: ${{ runner.temp }}/cbs-i2b-e2e/
          if-no-files-found: error
          retention-days: 14
      - name: Verify committed source and public JSON (production state; gold needs an AUTHORIZED release record)
        run: python -m etl.data_quality
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      # HIST-12: the TypeScript historical gate must agree with the Python contract on the SYNTHETIC fixtures (no browser, no network, no real data).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: .
      - run: python -m tests.hist12.gate_parity
        working-directory: .
