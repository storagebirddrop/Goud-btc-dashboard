name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Verify committed source and public JSON
        run: python -m etl.data_quality
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  gold_export_diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/gold-monthly-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real gold private candidate
        run: python -m etl.gold_backfill --output /tmp/gold-candidate.json
      - name: Check disabled export parity
        run: |
          python -m etl.static_export --output /tmp/gold-disabled.json
          cmp /tmp/gold-disabled.json frontend/public/data/monthly.json
          echo DISABLED_EXPORT_PARITY_PASS
      - name: Exercise explicitly enabled export only in temporary private path
        env:
          GOLD_PUBLICATION_ENABLED: 'true'
          GOLD_PUBLICATION_APPROVAL: APPROVED
        run: |
          python -m etl.static_export --gold-candidate /tmp/gold-candidate.json --approve-gold-publication --output /tmp/gold-enabled.json
          python -c 'import json; a=json.load(open("/tmp/gold-enabled.json"))["data"]; b=json.load(open("/tmp/gold-disabled.json"))["data"]; assert len(a)==len(b); assert sum(r["gold_index"] is not None for r in a)==320; assert a[0]["gold_index"]==100; assert all({k:v for k,v in x.items() if not k.startswith("gold_")}=={k:v for k,v in y.items() if not k.startswith("gold_")} for x,y in zip(a,b)); print("REAL_CANDIDATE_EXPORT_PASS",len(a),320,a[0]["period"],next(r["period"] for r in reversed(a) if r["gold_index"] is not None))'
