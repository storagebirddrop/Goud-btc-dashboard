name: Bootstrap npm lockfile
on:
  push:
    branches:
      - chore/project-foundation
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'storagebirddrop/Goud-btc-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): lock frontend dependencies"
            git push
          fi
