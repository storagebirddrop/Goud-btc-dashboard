name: CBS live contract smoke
on:
  pull_request:
    paths:
      - 'etl/sources/cbs.py'
      - 'tests/test_cbs_live.py'
      - '.github/workflows/cbs-live-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  cbs-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate live CBS metadata and monthly observations
        run: python -m pytest -q tests/test_cbs_live.py
        env:
          CBS_LIVE_TEST: '1'
