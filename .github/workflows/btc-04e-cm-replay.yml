name: BTC-04E Coin Metrics validation and replay (research only)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'validate (default, fails closed unless the pins MATCH) or bootstrap (explicit pin generation)'
        type: choice
        options: [validate, bootstrap]
        default: validate
  pull_request:
    paths:
      - '.github/workflows/btc-04e-cm-replay.yml'
      - 'tools/btc_04e_*.py'
      - 'tools/btc_06c_*.py'
      - 'tools/btc_public_report.py'
      - 'etl/btc_contract.py'
      - 'tests/test_btc_04e_*.py'
      - 'tests/test_btc_06c_*.py'
      - 'tests/test_btc_07b_*.py'
      - 'data/fixtures/btc04e/**'
permissions:
  contents: read
jobs:
  btc-04e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_btc_04e_cm_replay.py tests/test_btc_06c_candidate.py tests/test_btc_07b_p0_containment.py tests/test_btc_03_housing.py
      - name: Validate Coin Metrics PriceUSD x ECB x CBS (read-only; the replay snapshot stays private on the runner)
        run: >
          python -m tools.btc_04e_cm_replay
          --cbs-csv data/cbs-housing.csv
          --pins data/fixtures/btc04e/source_pins.json
          --mode "${BTC04E_MODE:-validate}"
          --export-snapshot "$RUNNER_TEMP/btc-04e-private-snapshot"
          --summary-out "$RUNNER_TEMP/btc-04e-private/summary.json"
          --public-summary-out "$RUNNER_TEMP/btc-04e-public/summary.json"
        env:
          BTC04E_MODE: ${{ inputs.mode }}
      - name: Build and validate the PRIVATE BTC-06C candidate (btc-monthly/1; value-free summary only; never uploaded, never published)
        run: >
          python -m tools.btc_06c_candidate
          --snapshot "$RUNNER_TEMP/btc-04e-private-snapshot"
          --cbs-csv data/cbs-housing.csv
          --legacy-json frontend/public/data/monthly.json
          --out-dir "$RUNNER_TEMP/btc-06c-private"
          --verify-release-path
      - name: Public QA summary (price-free allowlist only; the full private summary never leaves the runner)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-04e-public-summary-not-approved
          path: ${{ runner.temp }}/btc-04e-public/
          if-no-files-found: warn
          retention-days: 7
      - name: Print the public QA summary (price-free allowlist only)
        if: always()
        run: python -m tools.btc_04e_cm_replay --print-summary "$RUNNER_TEMP/btc-04e-public/summary.json"
