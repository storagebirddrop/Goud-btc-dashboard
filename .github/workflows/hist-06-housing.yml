name: HIST-06 housing history (research only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hist-06-housing.yml'
      - 'tools/hist_06_housing.py'
      - 'tests/test_hist_06_housing.py'
permissions:
  contents: read
jobs:
  housing:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies (poppler for pdftotext, tesseract for OCR of image-only pages; all in memory)
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-nld
      - name: Offline tests (synthetic, prove code only)
        run: python -m pytest -q tests/test_hist_06_housing.py tests/test_hist_02_acquire.py
      - name: Probe sources (unreachable = NOT_RETRIEVED, exit 0; integrity defects exit 1)
        run: python -m tools.hist_06_housing probe --cbs-csv data/cbs-housing.csv --summary-out "$RUNNER_TEMP/hist-06-housing.json"
      - name: Metadata-only review artifact (no raw third-party bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hist-06-housing-summary-review-only
          path: ${{ runner.temp }}/hist-06-housing.json
          if-no-files-found: warn
          retention-days: 14
      - name: Print aggregates-only digest
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/hist-06-housing.json" ]; then
            for s in cbs; do
              python -m tools.hist_06_housing digest "$RUNNER_TEMP/hist-06-housing.json" --section $s
            done
          fi
