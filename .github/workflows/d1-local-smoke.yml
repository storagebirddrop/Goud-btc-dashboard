name: D1 local import smoke
on:
  pull_request:
    paths:
      - 'etl/d1_import.py'
      - 'tests/test_d1_import.py'
      - 'db/migrations/**'
      - '.github/workflows/d1-local-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d1-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci
      - name: Apply schema to local D1
        working-directory: frontend
        run: npx wrangler d1 migrations apply gold-housing --local --migrations-dir ../db/migrations
      - name: Generate deterministic fixture SQL
        run: |
          python - <<'PY'
          from etl.d1_import import build_sql
          rows = [("2000-01", "nl_hpi", 60.0), ("2000-01", "nl_house_avg_eur", 175000.0)]
          open("db/local-import-smoke.sql", "w").write(build_sql(rows))
          PY
      - name: Import fixture twice into local D1
        working-directory: frontend
        run: |
          npx wrangler d1 execute gold-housing --local --file ../db/local-import-smoke.sql
          npx wrangler d1 execute gold-housing --local --file ../db/local-import-smoke.sql
      - name: Assert no duplicate rows
        working-directory: frontend
        run: |
          npx wrangler d1 execute gold-housing --local --command "SELECT series_id,period,value FROM observations ORDER BY series_id" --json > ../db/local-import-result.json
          python - <<'PY'
          import json
          payload = json.load(open("../db/local-import-result.json"))
          rows = payload[0]["results"]
          expected = {"nl_hpi": 60.0, "nl_house_avg_eur": 175000.0}
          assert len(rows) == 2, rows
          assert {r["series_id"]: r["value"] for r in rows} == expected, rows
          assert {r["period"] for r in rows} == {"2000-01"}, rows
          PY
