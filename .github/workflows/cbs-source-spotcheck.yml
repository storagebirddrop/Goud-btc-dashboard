name: CBS full historical source audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'etl/cbs_source_spotcheck.py'
      - 'tests/test_cbs_source_spotcheck.py'
      - '.github/workflows/cbs-source-spotcheck.yml'
permissions:
  contents: read
jobs:
  spotcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compare complete committed history to live CBS OData
        run: python -m etl.cbs_source_spotcheck --output cbs-history-audit.json
      - name: Preserve diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbs-history-audit
          path: cbs-source-spotcheck.json
          if-no-files-found: warn
