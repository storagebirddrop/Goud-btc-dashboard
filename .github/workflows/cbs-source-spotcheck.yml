name: CBS independent source spot-check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spotcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Compare committed values to live CBS OData
        run: python -m etl.cbs_source_spotcheck --output cbs-source-spotcheck.json
      - name: Preserve diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbs-source-spotcheck
          path: cbs-source-spotcheck.json
          if-no-files-found: warn
